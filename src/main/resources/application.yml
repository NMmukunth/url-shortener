spring:
  application:
    name: urlshortener

  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379